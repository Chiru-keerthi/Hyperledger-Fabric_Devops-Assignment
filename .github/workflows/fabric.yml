name: Hyperledger Fabric CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2: Deploy to EC2 (REAL EXECUTION)
      - name: Deploy Fabric on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |

            echo "🚀 Starting CI/CD Deployment on EC2"

            cd ~/fabric-project || exit

            git pull origin main

            echo "Stopping existing network..."
            cd fabric-samples/test-network
            ./network.sh down

            echo "Starting Fabric network..."
            ./network.sh up createChannel -ca

            echo "Deploying chaincode..."
            ./network.sh deployCC \
              -ccn basic \
              -ccp ../asset-transfer-basic/chaincode-go \
              -ccl go

            echo "Verifying containers..."
            docker ps
